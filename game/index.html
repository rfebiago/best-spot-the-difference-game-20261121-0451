<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twilight Market — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1122; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(1280px, 100vw); height: auto; aspect-ratio: 16 / 9;
    max-height: 100vh; background: #141b33; cursor: crosshair; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"
  aria-label="Twilight Market: a spot the difference game. Two near-identical night-market pictures side by side; click the differences."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
